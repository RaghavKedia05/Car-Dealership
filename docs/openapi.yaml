openapi: 3.0.3
info:
  title: Apex Auto Dealership API
  version: 3.0.0
  description: Public vehicle catalogue, email-verified registration, a shared customer and administrator sign-in, customer enquiries, and administrator operations.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      security: []
      summary: Send an email verification code to begin customer registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '202':
          description: Verification code sent; account is created after successful code verification
        '400':
          description: Invalid request
        '409':
          description: Email is already registered
        '429':
          description: Too many requests or a code was sent less than one minute ago
        '503':
          description: Email verification is not configured
  /auth/register/verify:
    post:
      security: []
      summary: Verify the registration code and create a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationVerification'
      responses:
        '201':
          description: Email verified; account created and signed in
        '400':
          description: Invalid or expired code
        '429':
          description: Too many verification attempts
  /auth/login:
    post:
      security: []
      summary: Sign in and obtain an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Access token and public user
        '401':
          description: Invalid credentials
  /auth/me:
    get:
      summary: Get the authenticated user
      responses:
        '200':
          description: Public user profile
        '401':
          description: Missing or invalid token
  /auth/logout:
    post:
      summary: Revoke the current access token
      responses:
        '204':
          description: Token revoked
        '401':
          description: Missing or invalid token
  /public/vehicles:
    get:
      security: []
      summary: Browse listed vehicles without an account
      parameters:
        - $ref: '#/components/parameters/page'
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 120
        - name: make
          in: query
          schema:
            type: string
            maxLength: 60
        - name: model
          in: query
          schema:
            type: string
            maxLength: 60
        - name: category
          in: query
          schema:
            type: string
            maxLength: 40
        - name: minPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [make, model, category, price, createdAt, year]
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Public catalogue page containing listed vehicles only
        '400':
          description: Invalid catalogue filter
  /public/vehicles/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      security: []
      summary: Read one publicly listed vehicle
      responses:
        '200':
          description: Vehicle details
        '404':
          description: Vehicle is missing or unlisted
  /enquiries:
    post:
      security:
        - {}
        - bearerAuth: []
      summary: Submit a vehicle or general enquiry
      description: Public endpoint with optional account association. Repeated submission keys return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnquiryInput'
      responses:
        '201':
          description: Enquiry created
        '400':
          description: Invalid enquiry
        '404':
          description: Selected vehicle is unavailable
        '409':
          description: Enquiry submission key was already used
        '429':
          description: Enquiry rate limit exceeded
  /admin/dashboard:
    get:
      summary: Get live inventory and enquiry aggregates (administrator)
      responses:
        '200':
          description: Inventory metrics, grouped inventory, and recent records
        '401':
          description: Authentication required
        '403':
          description: Administrator access required
  /admin/enquiries:
    get:
      summary: List and filter customer enquiries (administrator)
      parameters:
        - $ref: '#/components/parameters/page'
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [new, contacted, in_progress, resolved]
        - name: search
          in: query
          schema:
            type: string
            maxLength: 120
      responses:
        '200':
          description: Paginated enquiry results
        '403':
          description: Administrator access required
  /admin/enquiries/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Read one enquiry (administrator)
      responses:
        '200':
          description: Enquiry record
        '404':
          description: Enquiry not found
    patch:
      summary: Update enquiry status (administrator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [new, contacted, in_progress, resolved]
      responses:
        '200':
          description: Updated enquiry record
        '400':
          description: Invalid status
        '403':
          description: Administrator access required
        '404':
          description: Enquiry not found
  /ai/car-finder:
    post:
      summary: Interpret a natural-language request and recommend available inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 3
                  maxLength: 2000
                  example: Family SUV under ₹20 lakh with at least five seats
      responses:
        '200':
          description: Interpreted criteria, grounded matches, or one-filter-relaxed alternatives
        '400':
          description: Invalid query
        '401':
          description: Authentication required
        '429':
          description: Finder rate limit exceeded
  /ai/car-finder/compare:
    post:
      summary: Compare current inventory records using recorded specifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_ids]
              properties:
                vehicle_ids:
                  type: array
                  minItems: 2
                  maxItems: 3
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
                original_query:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Comparison of current vehicle records and known differences
        '400':
          description: Invalid vehicle IDs
        '401':
          description: Authentication required
        '404':
          description: One or more vehicles were not found
        '429':
          description: Finder rate limit exceeded
  /vehicles:
    get:
      summary: List inventory with filters, sorting, and pagination
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [make, model, category, price, createdAt]
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: make
          in: query
          schema:
            type: string
        - name: model
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          schema:
            type: number
            minimum: 0
      responses:
        '200':
          description: Inventory page
        '400':
          description: Invalid filter or pagination value
        '401':
          description: Authentication required
    post:
      summary: Create a vehicle (administrator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleInput'
      responses:
        '201':
          description: Vehicle created
        '403':
          description: Administrator access required
  /vehicles/search:
    get:
      summary: Search inventory (same filters as GET /vehicles)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [make, model, category, price, createdAt]
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: make
          in: query
          schema:
            type: string
        - name: model
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          schema:
            type: number
            minimum: 0
      responses:
        '200':
          description: Filtered inventory page
        '400':
          description: Invalid search range
  /vehicles/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Get one vehicle
      responses:
        '200':
          description: Vehicle details
        '404':
          description: Vehicle not found
    put:
      summary: Replace vehicle fields (administrator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleInput'
      responses:
        '200':
          description: Updated vehicle
        '403':
          description: Administrator access required
        '404':
          description: Vehicle not found
    delete:
      summary: Delete vehicle (administrator; blocked if purchased)
      responses:
        '204':
          description: Vehicle deleted
        '403':
          description: Administrator access required
        '404':
          description: Vehicle not found
        '409':
          description: Purchase history prevents deletion
  /vehicles/{id}/purchase:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      summary: Retired direct-purchase endpoint
      responses:
        '410':
          description: Use the secure payment checkout flow
  /vehicles/{id}/checkout:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      summary: Reserve one unit and create a Razorpay order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerName, email, phone, deliveryAddress]
              properties:
                customerName: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, format: email }
                phone: { type: string, minLength: 7, maxLength: 20 }
                deliveryAddress: { type: string, minLength: 8, maxLength: 500 }
      responses:
        '201':
          description: Razorpay order and temporary stock reservation
        '409':
          description: Vehicle is unavailable
        '503':
          description: Payment gateway is not configured
  /checkout/{id}/verify:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      summary: Verify captured payment and complete purchase
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentId, signature]
              properties:
                paymentId: { type: string }
                signature: { type: string }
      responses:
        '200':
          description: Payment verified and purchase completed
        '400':
          description: Invalid payment signature
        '409':
          description: Checkout expired or payment is not captured
  /vehicles/{id}/restock:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      summary: Restock a vehicle (administrator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 1000000
      responses:
        '200':
          description: Updated vehicle
        '400':
          description: Invalid restock amount
        '403':
          description: Administrator access required
        '404':
          description: Vehicle not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 12
  schemas:
    Registration:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 72
    RegistrationVerification:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^[0-9]{6}$'
    VehicleInput:
      type: object
      required: [make, model, category, price, quantity]
      properties:
        make:
          type: string
          minLength: 1
          maxLength: 60
        model:
          type: string
          minLength: 1
          maxLength: 60
        category:
          type: string
          minLength: 1
          maxLength: 40
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Price in Indian rupees (INR)
        quantity:
          type: integer
          minimum: 0
          maximum: 1000000
        bodyType:
          type: string
          maxLength: 40
          nullable: true
        year:
          type: integer
          minimum: 1886
          maximum: 2100
          nullable: true
        fuelType:
          type: string
          enum: [petrol, diesel, electric, hybrid, cng, lpg]
          nullable: true
        transmission:
          type: string
          enum: [automatic, manual]
          nullable: true
        seatingCapacity:
          type: integer
          minimum: 1
          maximum: 20
          nullable: true
        mileageKmpl:
          type: number
          minimum: 0
          exclusiveMinimum: true
          nullable: true
        electricRangeKm:
          type: number
          minimum: 0
          exclusiveMinimum: true
          nullable: true
        engineCapacityCc:
          type: integer
          minimum: 1
          nullable: true
        groundClearanceMm:
          type: integer
          minimum: 1
          nullable: true
        safetyFeatures:
          type: string
          maxLength: 500
          nullable: true
        variant:
          type: string
          maxLength: 80
          nullable: true
        description:
          type: string
          maxLength: 4000
          nullable: true
        imageUrl:
          type: string
          format: uri
          description: HTTPS image URL; image upload/storage is not provided.
          nullable: true
        status:
          type: string
          enum: [listed, unlisted]
          default: listed
    EnquiryInput:
      type: object
      required: [submissionKey, customerName, email, subject, message]
      properties:
        submissionKey:
          type: string
          format: uuid
        customerName:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 30
        subject:
          type: string
          minLength: 3
          maxLength: 120
        message:
          type: string
          minLength: 10
          maxLength: 4000
        vehicleId:
          type: string
          format: uuid
          nullable: true
